[project]
name = "uffizi-rl"
version = "1.0.0"
description = "Reinforcement Learning for Museum Visitor Flow Optimization (course project, BSE Spring 2026)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Core scientific computing
    "numpy>=1.26",
    "networkx>=3.2",
    # RL framework
    "gymnasium>=0.29",
    "stable-baselines3>=2.3",
    "sb3-contrib>=2.3",
    # PyTorch is required by stable-baselines3
    "torch>=2.2",
    # Plotting
    "matplotlib>=3.8",
    "seaborn>=0.13",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
